name: traces_mobile
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # Maps & Location
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^12.0.0
  
  # Network & Data
  dio: ^5.9.1
  supabase_flutter: ^2.5.0
  
  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  
  # Navigation & UI
  go_router: ^14.1.0
  flutter_animate: ^4.5.2
  google_fonts: ^6.2.1
  share_plus: ^12.0.1
  path_provider: ^2.1.5
  screenshot: ^3.0.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.1.4
  sensors_plus: ^7.0.0
  confetti: ^0.8.0
  shimmer: ^3.0.0
  animations: ^2.1.1
  audioplayers: ^6.5.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  cached_network_image: ^3.4.1
  font_awesome_flutter: ^10.12.0
  haptic_feedback: ^0.6.4+3
  flutter_staggered_grid_view: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/
    - assets/sounds/
  shaders:
    - assets/shaders/scanline.frag
    - assets/shaders/liquid_orb.frag